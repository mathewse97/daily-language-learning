<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Sem esta linha o telefone renderiza a página como se fosse uma tela de
     1000px e depois afasta o zoom: tudo fica minúsculo. Enquanto a página era
     uma artifact, quem a fornecia era o invólucro; num arquivo servido por
     conta própria ela tem de estar aqui. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0C0E12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acharnae">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Morning Packet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0C0E12; --surface:#13161C; --surface-2:#191D25; --surface-3:#222732;
    --ink:#E8EBF0; --ink-soft:#9BA3B2; --ink-faint:#6B7484;
    --rule:#1F242E; --rule-2:#2C3341;
    --accent:#5B8DEF; --accent-ink:#8AAEF6; --accent-soft:rgba(91,141,239,.15);
    --ok:#5FCB92; --ok-soft:rgba(95,203,146,.14);
    --warn:#E3C567; --warn-soft:rgba(227,197,103,.14);
    --flag:#E0A458; --flag-soft:rgba(224,164,88,.14);
    --serif:"EB Garamond",Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    --r:14px; --r-sm:10px;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 8px 24px rgba(0,0,0,.28);
  }
  :root[data-theme="light"]{
    --ground:#F7F8FA; --surface:#FFFFFF; --surface-2:#F2F4F7; --surface-3:#E7EAF0;
    --ink:#15181E; --ink-soft:#525A68; --ink-faint:#818A99;
    --rule:#E6E9EF; --rule-2:#D2D7E0;
    --accent:#2E5FC0; --accent-ink:#25509F; --accent-soft:rgba(46,95,192,.10);
    --ok:#1F7A4C; --ok-soft:rgba(31,122,76,.10);
    --warn:#8A6D12; --warn-soft:rgba(138,109,18,.10);
    --flag:#B26B14; --flag-soft:rgba(178,107,20,.10);
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
    margin:0; padding:0;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.028;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }
  main{position:relative;z-index:1;max-width:44rem;margin:0 auto;padding:22px 16px 80px}

  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
  h1{font-size:1.75rem;line-height:1.15;font-weight:800}
  p{margin:0 0 .8em}
  p:last-child{margin-bottom:0}
  a{color:var(--accent-ink)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  .ph{margin-bottom:18px}
  .ph .eyebrow{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);margin:0 0 5px;
  }
  .ph .sub{color:var(--ink-soft);margin:6px 0 0;max-width:62ch;font-size:13.5px}

  .stats{
    display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);
    border-radius:5px;overflow:hidden;
    grid-template-columns:repeat(auto-fit,minmax(78px,1fr));margin:18px 0 20px;
  }
  .stats div{background:var(--surface);padding:10px 13px}
  .stats dt{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
  .stats dd{margin:2px 0 0;font-size:1.35rem;font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums}
  .stats dd small{display:block;margin-top:1px;font-size:.7rem;font-family:var(--sans);font-weight:400;color:var(--ink-faint);line-height:1.3}

  nav.days{
    display:flex;flex-wrap:wrap;gap:4px;margin-bottom:20px;
    position:sticky;top:0;z-index:3;background:var(--ground);
    padding:8px 0;border-bottom:1px solid var(--rule);
  }
  nav.days button{
    font:inherit;font-size:12.5px;font-family:var(--sans);
    background:transparent;border:1px solid transparent;color:var(--ink-soft);
    padding:5px 11px;border-radius:4px;cursor:pointer;transition:background .12s,color .12s;
  }
  nav.days button:hover{background:var(--surface-2);color:var(--ink)}
  nav.days button[aria-current="true"]{
    background:var(--accent-soft);color:var(--accent-ink);font-weight:500;
    box-shadow:inset 2px 0 0 var(--accent);
  }
  nav.days button .n{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:5px}

  .day{display:flex;flex-direction:column;gap:14px}
  .day[hidden]{display:none}

  .card{
    background:var(--surface);border:1px solid var(--rule);border-radius:6px;
    padding:16px 18px;transition:border-color .12s,box-shadow .12s;
    display:flex;flex-direction:column;gap:12px;
  }
  .card:hover{border-color:var(--rule-2);box-shadow:var(--shadow)}
  .card > header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .b{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:2px 7px;border-radius:3px;
  }
  .b.gr{background:var(--accent-soft);color:var(--accent-ink)}
  .b.it{background:var(--ok-soft);color:var(--ok)}
  .b.en{background:var(--warn-soft);color:var(--warn)}
  .b.tag{background:var(--surface-3);color:var(--ink-faint)}
  .card > header .min{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:auto}

  .sect{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 3px}
  .setting{color:var(--ink-soft);font-size:13px;margin:0}
  .muted{color:var(--ink-soft)}
  .small{font-size:12.5px;color:var(--ink-faint)}

  .gi{font-family:var(--serif);font-size:1.1em}
  .ita{font-family:var(--serif);font-size:1.12rem;line-height:1.8;margin:0}
  .eng{font-size:14px;line-height:1.68;display:flex;flex-direction:column;gap:.75em}

  .glosses{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink-soft);margin:0}
  .glosses b{font-family:var(--serif);font-size:1.15em;font-weight:500;color:var(--ink)}

  .sound{
    background:var(--surface-2);border-left:2px solid var(--flag);border-radius:0 4px 4px 0;
    padding:9px 12px;font-size:13px;margin:0;
  }
  .sound b{color:var(--flag);font-weight:500}

  .note{border-left:2px solid var(--rule-2);padding-left:12px;font-size:13.5px;margin:0;color:var(--ink-soft)}
  .note b{color:var(--ink);font-weight:500}
  /* Nota de forma: uma linha sobre uma forma nova que está no texto do dia. */
  .form{border-left:2px solid var(--accent-ink);padding-left:12px;font-size:13px;margin:0;color:var(--ink-soft)}
  .form b{color:var(--accent-ink);font-weight:500}
  /* Curiosidade: só em dia com gancho, sempre com a fonte. */
  .curio{border-left:2px solid var(--rule-2);padding-left:12px;font-size:13px;margin:0;color:var(--ink-soft)}
  .curio b{color:var(--ink);font-weight:500}
  /* Correções da auditoria mensal, no topo do cartão de segunda. */
  .fix{border:1px solid var(--flag);border-radius:5px;padding:10px 14px;font-size:13px}
  .cast{display:flex;flex-direction:column;gap:3px;font-size:13px}
  .cast b{font-family:var(--serif);font-size:1.1em;font-weight:500}

  ul,ol{margin:0;padding-left:1.15rem;display:flex;flex-direction:column;gap:.3em;font-size:13.5px}

  details{border-top:1px solid var(--rule);padding-top:10px}
  summary{
    cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-faint);list-style:none;
  }
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--ink-faint)}
  details[open] summary::before{content:"▾ "}
  summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  details > .dz{padding-top:10px;display:flex;flex-direction:column;gap:8px}

  .letters{
    font-family:var(--serif);font-size:1.15rem;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(5rem,1fr));gap:5px 8px;
  }
  .letters span{display:flex;gap:5px;align-items:baseline}
  .letters em{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--ink-faint)}

  .ans{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
  .ans > span{display:flex;gap:8px}
  .ans i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);padding-top:3px}

  .rec{
    background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;
    padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;
  }
  .rec ol{display:flex;flex-direction:column;gap:6px}
  .rec .gi{font-size:1.05em}

  .il{display:flex;flex-wrap:wrap;column-gap:13px;row-gap:15px;align-items:start;
    background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;
    padding:15px 14px;margin:0;cursor:pointer;transition:border-color .12s}
  .il:hover,.il:focus-visible{border-color:var(--rule-2)}
  .w{display:grid;grid-template-rows:14px auto 13px;justify-items:center;row-gap:2px}
  .w .pt{font-size:11px;line-height:14px;color:var(--accent-ink);
    font-family:var(--sans);white-space:nowrap}
  .w .gr{font-family:var(--serif);font-size:1.45rem;line-height:1.3;white-space:nowrap}
  .w .tr{font-size:10px;line-height:13px;color:var(--ink-faint);
    font-family:var(--mono);white-space:nowrap}
  .w.known .pt,.w.known .tr{visibility:hidden}
  .w.new .gr{color:var(--accent-ink)}
  /* Toque no texto interlinear esconde o apoio, palavra por palavra, sem mudar
     nenhuma altura: .w já reserva as três linhas (14px/auto/13px) sempre, então
     visibility:hidden nunca move nada — o mesmo truque de .w.known acima. Nunca
     esconde .gr (o grego) nem as palavras que .w.known já esconde por si. */
  .il.step-tr .w:not(.known) .tr{visibility:hidden}
  .il.step-none .w:not(.known) .tr,
  .il.step-none .w:not(.known) .pt{visibility:hidden}
  .br{flex-basis:100%;height:0;margin:0}

  .foot{border-top:1px solid var(--rule);margin-top:26px;padding-top:14px;font-size:12.5px;color:var(--ink-faint);display:flex;flex-direction:column;gap:.5em}
  .err{border:1px solid var(--flag);border-radius:6px;padding:14px 16px;color:var(--flag);font-family:var(--mono);font-size:12px;white-space:pre-wrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:420px){ h1{font-size:1.4rem} main{padding:16px 12px 60px} }

/* ===== recursos de leitura: card ao toque, áudio, abas por idioma, mapas, fotos ===== */
  backdrop-filter:blur(6px);padding:8px 12px;font-size:12px;color:var(--ink)}
  color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
  color:var(--flag);border:1px solid var(--flag);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}

/* mapas, linhas do tempo, sons */
details.viz{border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--surface-2);padding:0 12px}
details.viz > summary{padding:9px 0}
details.viz .dz{padding:2px 0 12px;display:block}
.viz svg{width:100%;height:auto;display:block;max-height:340px}
.viz .cap{font-size:11.5px;color:var(--ink-faint);margin:6px 0 0}
.viz .land{fill:var(--surface-3);stroke:var(--rule-2);stroke-width:1}
.viz .hill{fill:none;stroke:var(--ink-faint);stroke-width:1;stroke-linejoin:round}
.viz .sea{fill:var(--surface)}
.viz .pt{fill:var(--accent)}
.viz .pt2{fill:var(--flag)}
.viz .ptd{fill:var(--ink-faint)}
.viz .lbl{fill:var(--ink);font:11px var(--sans)}
.viz .lbl2{fill:var(--ink-soft);font:9.5px var(--sans)}
.viz .lblb{fill:var(--accent-ink);font:600 11px var(--sans)}
.viz .route{stroke:var(--flag);stroke-width:1.8;stroke-dasharray:5 4;fill:none}
.viz .axis{stroke:var(--rule-2);stroke-width:2}
.viz .tick{stroke:var(--ink-faint);stroke-width:1}
.viz .bar-l{fill:var(--accent)}
.viz .bar-b{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.viz .bar-d{fill:var(--flag)}
.viz .glyph{fill:var(--ink);font:600 22px var(--serif)}
.viz .curve{stroke:var(--accent-ink);stroke-width:2.4;fill:none;stroke-linecap:round}

/* imagens do dia (ao tocar nas palavras concretas) */
.pics{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0}
.pic{width:78px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--surface-2);padding:6px 4px 5px;
  text-align:center}
.pic svg{width:44px;height:44px;stroke:var(--accent-ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pic .g{font:500 1.05rem var(--serif);color:var(--ink);line-height:1.15}
.pic .p{font-size:10.5px;color:var(--ink-faint)}

/* cores nas terminações */
.cores-on .e-obj{color:var(--flag);font-weight:600}
.cores-on .e-pl{color:var(--ok);font-weight:600}
.legenda{font-size:11.5px;color:var(--ink-faint);display:none}
.cores-on .legenda{display:block}
.legenda .e-obj{color:var(--flag)}.legenda .e-pl{color:var(--ok)}

/* "não lembrei", "li hoje", resumo do domingo */
.rec li{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.rec li .t{flex:1}
button.nl{font:inherit;font-size:11px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-faint);
  border-radius:999px;padding:1px 9px;cursor:pointer;white-space:nowrap}
button.nl[aria-pressed="true"]{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.readbar{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border:1px dashed var(--rule-2);
  border-radius:var(--r-sm);font-size:12.5px;color:var(--ink-soft)}
.readbar button{font:inherit;font-size:12.5px;border:1px solid var(--ok);background:transparent;color:var(--ok);
  border-radius:999px;padding:3px 12px;cursor:pointer}
.readbar button[aria-pressed="true"]{background:var(--ok-soft)}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule-2);background:var(--surface-2);
  color:var(--ink);font-size:16px;cursor:pointer}
.stepper output{font:500 1.2rem var(--serif);min-width:3.2rem;text-align:center}
.seg{display:inline-flex;gap:4px}
.seg button{width:28px;height:28px;border-radius:8px;border:1px solid var(--rule-2);background:var(--surface-2);
  color:var(--ink);cursor:pointer;font:inherit}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.sum .rowx{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;
  border-bottom:1px solid var(--rule)}
.sum textarea{width:100%;min-height:150px;background:var(--surface-2);color:var(--ink);border:1px solid var(--rule-2);
  border-radius:var(--r-sm);padding:10px;font:12.5px/1.5 var(--mono)}
.sum .copy{margin-top:8px;font:inherit;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);
  border-radius:999px;padding:5px 16px;cursor:pointer}
.audio{font:inherit;font-size:12px;border:1px solid var(--rule-2);background:var(--surface-2);color:var(--ink);
  border-radius:999px;padding:3px 12px;cursor:pointer;margin-bottom:8px}
.audio small{color:var(--ink-faint)}

/* card ao toque na palavra */
.il{cursor:default}
.w{cursor:pointer;border-radius:6px}
button.sp{align-self:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--rule-2);
  background:var(--surface-3);color:var(--accent-ink);font-size:11px;cursor:pointer;padding:0;flex:none}
.pop{position:absolute;z-index:60;width:230px;background:var(--surface);border:1px solid var(--rule-2);
  border-radius:12px;box-shadow:var(--shadow);padding:10px 12px 11px}
.pop .top{display:flex;gap:10px;align-items:center}
.pop svg{width:46px;height:46px;flex:none;stroke:var(--accent-ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pop .gw{font:500 1.7rem/1.1 var(--serif)}
.pop .tr{font:11px var(--mono);color:var(--ink-faint)}
.pop .pt{font-size:15px;color:var(--accent-ink);margin-top:6px}
.pop .ph{font-size:10.5px;color:var(--ink-faint);margin-top:6px}
.pop .row{display:flex;gap:8px;align-items:center;margin-top:8px}
.pop button{font:inherit;font-size:12px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);
  border-radius:999px;padding:3px 12px;cursor:pointer}
.pop::before{content:"";position:absolute;top:-6px;left:var(--ax,24px);width:10px;height:10px;background:var(--surface);
  border-left:1px solid var(--rule-2);border-top:1px solid var(--rule-2);transform:rotate(45deg)}
.pop.up::before{top:auto;bottom:-6px;transform:rotate(225deg)}
.sup{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.sup button{font:inherit;font-size:12px;border:1px solid var(--rule-2);background:var(--surface-2);color:var(--ink);
  border-radius:999px;padding:3px 12px;cursor:pointer}
.sup button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.aviso{font-size:11.5px;color:var(--flag);margin:4px 0 0}

.pop .nota{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.4}
.pop .b-esq{border-color:var(--rule-2);background:transparent;color:var(--ink-faint)}
.pop .b-esq[aria-pressed="true"]{border-color:var(--flag);background:var(--flag-soft);color:var(--flag)}
.pop .row{flex-wrap:wrap}

.pop{width:210px}
.pop .pt{font-size:16px;margin-top:4px}
.pop .nota{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35}
.pop details.gram{margin-top:8px;font-size:12px;color:var(--ink-soft)}
.pop details.gram summary{cursor:pointer;color:var(--ink-faint);font-size:11.5px}
.pop details.gram div{margin-top:4px;line-height:1.4}

/* organização da interface */
nav.days button.lido::after{content:" ✓";color:var(--ok);font-size:10px}
.tabs2{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:12.5px;border:1px solid var(--rule-2);background:var(--surface-2);color:var(--ink-soft);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.tpanel{border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--surface-2);padding:12px;display:flex;flex-direction:column;gap:12px}
.tpanel .sound,.tpanel .form,.tpanel .curio{background:none;border:0;padding:0;margin:0}
.tpanel .vz svg{max-height:300px}
header.acc{cursor:pointer;align-items:center}
.chev{color:var(--ink-faint);margin-right:6px;font-size:12px}
.preview{font-size:12.5px;color:var(--ink-faint);margin:2px 0 0}
.preview:empty{display:none}
.readbar{position:sticky;bottom:10px;background:var(--surface);box-shadow:var(--shadow);z-index:20}

.readbar button{white-space:nowrap}
.readbar{font-size:12px}

/* v5: player, palavras tocáveis, modo foco, abas */
.player{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-top:1px solid var(--rule-2);
  box-shadow:0 -4px 16px rgba(0,0,0,.25);padding:8px 12px calc(8px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.player[hidden]{display:none}
.pl-title{font-size:12px;color:var(--ink-faint);margin-bottom:2px}
.pl-bar{display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--ink-faint)}
.pl-bar input{flex:1;accent-color:var(--accent)}
.pl-row{display:flex;gap:6px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.pl-row button{font:inherit;font-size:12.5px;border:1px solid var(--rule-2);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.pl-row .main{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);min-width:48px}
body.com-player{padding-bottom:120px}
.tk{cursor:pointer;border-radius:4px}
.tpanel[hidden]{display:none}
.viz{width:100%}
.sobre{margin-top:6px;font-size:12.5px}
.sobre summary{cursor:pointer;color:var(--ink-faint)}

/* v6: preenchimento, fotos, notas nas palavras */
.pop .foto{width:100%;height:96px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block}
.pop .fam{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.4;border-left:2px solid var(--accent);padding-left:8px}
.pop .fam b{color:var(--accent-ink);font-weight:600}
.gw.it{font:500 1.35rem/1.15 var(--serif)}

/* v6: correções de UI (escala única, contraste, blocos com função) */
:root{--ink-faint:#8E97A8}
:root[data-theme="light"]{--ink-faint:#5F6877}
nav.days{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:2px}
nav.days button{flex:none;min-height:40px}
.readbar,body.foco .readbar{position:static;box-shadow:none;margin-top:16px}
.il{row-gap:12px}
.br{border-top:1px solid var(--rule);margin:2px 0 0}
.card{--g:14px}
.card > *+*{margin-top:var(--g)}
.card details > summary{padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);min-height:38px;display:flex;align-items:center;color:var(--ink-soft)}
.card details > summary:hover{border-color:var(--rule-2);color:var(--ink)}
.card details[open] > summary{border-color:var(--accent);color:var(--accent-ink)}
.note,.curio,.form{border:1px solid var(--rule);border-left-width:4px;border-radius:8px;padding:10px 12px;background:var(--surface-2);font-size:13.5px;line-height:1.5}
.note{border-left-color:var(--accent)}
.curio{border-left-color:var(--flag)}
.form{border-left-color:var(--ok)}
.note>b:first-child,.curio>b:first-child,.form>b:first-child{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.note>b:first-child{color:var(--accent-ink)}.curio>b:first-child{color:var(--flag)}.form>b:first-child{color:var(--ok)}
.note>b:first-child::before{content:"✎ "}.curio>b:first-child::before{content:"✦ "}.form>b:first-child::before{content:"◇ "}
.fonte{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed var(--rule-2);font-size:12px;color:var(--ink-faint)}
.fonte::before{content:"Fonte · ";font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.audio{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 16px;font-size:13.5px;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.audio small{font-size:11.5px;color:var(--ink-soft)}
.sup button{min-height:40px;padding:6px 16px;font-size:13px}
.sup button:first-child{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
p.small:has(> a){display:flex;align-items:center;gap:6px;padding:10px 12px;border:1px dashed var(--rule-2);border-radius:8px;color:var(--ink-soft)}
p.small a{font-weight:600;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.chips button{min-height:38px}
.sect{margin-bottom:6px}
.card > header .b{font-size:10.5px}
nav.days{top:34px}

/* v7: preenchimento suave por letra (sem retângulo, sem sublinhado) */
:root{--hl:#A99BF0}
:root[data-theme="light"]{--hl:#5B4BC4}
.w .gr,.tk{--p:0%}
.w.now .gr,.tk.now{background:linear-gradient(90deg,var(--hl) var(--p),currentColor var(--p));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.w.lido-w .gr,.tk.lido-w{color:var(--hl)}
.w.lido-w .gr .e-obj,.w.lido-w .gr .e-pl{color:inherit}
.tk{cursor:pointer;transition:color .15s}
.tk:hover{color:var(--accent-ink)}


/* v7: respiro */
.cbody{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.cbody > *{margin:0}
.cbody .sect{margin:0 0 10px}
.cbody ol,.cbody ul{padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.55;margin:0}
.cbody p.ita{font-size:1.1rem;line-height:1.75}
.cbody .eng p{line-height:1.7;margin:0 0 14px;font-size:1.02rem}
.cbody .eng p:last-child{margin-bottom:0}
.cbody .rec{gap:12px;padding:14px 16px}
.cbody .rec ol{gap:10px}
.cbody .note,.cbody .curio,.cbody .form{padding:14px 16px;line-height:1.6}
.cbody details.ans-d > .dz,.cbody details > .dz{padding:12px 4px 4px}
.cbody .ans{gap:10px}
.cbody .produce p,.cbody .produce{line-height:1.6}
.ver-modelo{margin-top:12px}
.audio{margin:0}
.card{gap:20px}
.tpanel{padding:16px;gap:16px}

/* v7: Quem é quem em cartões */
.elenco{display:flex;flex-direction:column;gap:16px}
.elenco h4{margin:0 0 8px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.grupo{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pers{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
.pers .av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:500 1.3rem var(--serif);
  background:var(--accent-soft);color:var(--accent-ink)}
.pers.casa .av{background:var(--ok-soft);color:var(--ok)}
.pers.fora .av{background:var(--flag-soft);color:var(--flag)}
.pers.mito .av{background:var(--surface-3);color:var(--hl)}
.pers .nm{font:500 1.05rem/1.15 var(--serif)}
.pers .pt2{font-size:12px;color:var(--ink-soft);line-height:1.3}
.pers .tg{display:inline-block;margin-top:3px;font:10px var(--mono);color:var(--ink-faint);border:1px solid var(--rule-2);border-radius:999px;padding:0 6px}
.pop .exp{font-size:12px;color:var(--ink-soft);line-height:1.4;margin-top:6px}

.cbody p.small:not(:has(> a)){border:1px solid var(--rule);border-left:4px solid var(--hl);border-radius:8px;background:var(--surface-2);
  padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--ink-soft);display:block}
.cbody p.small:not(:has(> a)) > b:first-child{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hl);margin-bottom:6px}
.cbody p.small:not(:has(> a)) em{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;font-style:italic}

/* v8: estilo híbrido (estrutura do Job System + serifa do Bibliotheca) */
:root{--ground:#0A0C10;--shadow-j:0 18px 28px rgba(0,0,0,.28)}
:root[data-theme="light"]{--ground:#F4F4F5;--surface-2:#F4F4F5;--rule:#EAEAED;--shadow-j:0 16px 24px rgba(0,0,0,.05)}
main{padding-top:14px}
.card{border:0;border-radius:18px;box-shadow:var(--shadow-j);padding:22px 20px;gap:20px}
.card:hover{box-shadow:var(--shadow-j)}
.card > header{padding-bottom:2px}
.b{font:600 11px var(--sans);letter-spacing:.02em;text-transform:none;border-radius:999px;padding:3px 11px 3px 9px;display:inline-flex;align-items:center;gap:6px}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.card > header .min{font:12px var(--sans)}
.sect{font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px}
.setting{font-family:var(--serif);font-size:1.15rem;line-height:1.45;color:var(--ink)}
.rec,.cbody .rec{background:var(--surface-2);border:0;border-radius:14px;padding:16px 18px}
.il{background:var(--surface-2);border:0;border-radius:14px;padding:18px 16px}
.il:hover,.il:focus-visible{border:0;outline:0}
.note,.curio,.form{border:0;border-left:0;border-radius:14px;background:var(--surface-2);padding:16px 18px 16px 18px;position:relative}
.note::before,.curio::before,.form::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0}
.note::before{background:var(--accent)}.curio::before{background:var(--flag)}.form::before{background:var(--ok)}
.cbody p.small:not(:has(> a)){border:0;border-radius:14px;background:var(--surface-2);position:relative}
.cbody p.small:not(:has(> a))::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--hl)}
.card details > summary{border:0;background:var(--surface-2);border-radius:12px;font:600 12.5px var(--sans);letter-spacing:.01em;text-transform:none;color:var(--ink-2,var(--ink))}
.card details[open] > summary{background:var(--accent-soft);color:var(--accent-ink)}
nav.days{background:var(--ground);border-bottom:0;gap:6px;padding:10px 0;margin-bottom:12px}
nav.days button{border-radius:12px;padding:8px 14px;font-weight:600}
nav.days button[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow-j);border-color:transparent;color:var(--ink)}
.chips button,.sup button,.audio{border-radius:12px}
.pers,.pop{border-radius:14px}
.nota-w{color:color-mix(in srgb,var(--ink) 62%,var(--accent-ink))}
.p.il .gr{}
/* abas por idioma */
.langtabs{display:flex;gap:6px;background:var(--surface-2);border-radius:14px;padding:5px;box-shadow:inset 0 0 0 1px var(--rule)}
.langtabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;color:var(--ink-soft);
  font:600 13px var(--sans);padding:9px 6px 8px;border-radius:10px;cursor:pointer;position:relative}
.langtabs button small{font:400 11px var(--sans);color:var(--ink-faint)}
.langtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-j)}
.langtabs .ld{position:absolute;top:8px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--ink-faint)}
.langtabs .ld.gr{background:var(--accent)}.langtabs .ld.it{background:var(--ok)}.langtabs .ld.en{background:var(--warn)}
section.day > article.card[hidden]{display:none}
.readbar{border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow-j)}
:root{--surface:#171B24;--surface-2:#1E232D}
:root[data-theme="light"]{--surface:#FFFFFF;--surface-2:#F4F4F5}
.card > *+*{margin-top:0}
.card details > summary::before{margin-right:8px}
p.small:has(> a){display:block}
p.small a{margin-left:2px}
.card{gap:18px}

/* v9 */
.tpanel .curio,.tpanel .note,.tpanel .form{padding:0 0 0 16px;background:none}
.tpanel .curio::before,.tpanel .note::before,.tpanel .form::before{top:2px;bottom:2px}
.fotoW{display:block;position:relative;width:100%;padding:0;border:0;background:var(--surface-3);border-radius:10px;overflow:hidden;cursor:zoom-in;margin-bottom:8px}
.fotoW .foto{width:100%;height:auto;max-height:190px;object-fit:contain;margin:0;border-radius:0;display:block}
.fotoW span,.fth span{position:absolute;right:6px;bottom:6px;font:600 11px var(--sans);color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:2px 9px}
.fotos{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.fth{position:relative;flex:none;border:0;padding:0;background:var(--surface-3);border-radius:12px;overflow:hidden;cursor:zoom-in}
.fth img{display:block;height:150px;width:auto;max-width:78vw}
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#cfd3dc;font-size:12px}
.lb-top button{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:7px 16px;cursor:pointer}
.lb-scroll{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;min-height:0}
.lb-scroll img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.lb.zoom .lb-scroll{display:block}
.lb.zoom .lb-scroll img{max-width:none;max-height:none;width:230%;cursor:zoom-out}
.lb-cap{padding:12px 16px calc(14px + env(safe-area-inset-bottom));color:#e6e8ee;font-size:13px;line-height:1.45;max-height:30vh;overflow:auto}
.lb-cap p{margin:0 0 6px}.lb-cap small{color:#9aa1b0;font-size:11.5px}.lb-cap a{color:#8aaef6}
/* respostas na frente de cada item */
.rec .resp{display:none;font-weight:600;color:var(--ok);margin-left:2px}
.rec.mostra .resp{display:inline}
.rec.mostra .q{display:none}
.resp-b{display:none;margin-top:6px;padding:8px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ink);font-size:13.5px;line-height:1.5}
.mostra .resp-b{display:block}
button.conf{align-self:flex-start;font:600 12.5px var(--sans);border:0;background:var(--surface);color:var(--accent-ink);border-radius:12px;padding:9px 16px;cursor:pointer;box-shadow:var(--shadow-j)}
.rec button.conf{margin-top:2px}
/* linha do tempo vertical */
.vt{list-style:none;margin:6px 0 0;padding:0 0 0 18px;position:relative}
.vt::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--rule-2);border-radius:2px}
.vt li{position:relative;display:flex;gap:14px;align-items:baseline;padding:7px 0}
.vt li::before{content:"";position:absolute;left:-18px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.vt li.dest::before{background:var(--flag);border-color:var(--flag)}
.vt li b{flex:none;min-width:92px;font:600 14px var(--sans);color:var(--accent-ink)}
.vt li.dest b{color:var(--flag)}
.vt li span{color:var(--ink);font-size:14px}
.vt li.gap{padding:0 0 0 0}
.vt li.gap::before{display:none}
.vt li.gap span{font-size:11.5px;color:var(--ink-faint);padding:2px 0 2px 106px}
.vt{padding-left:30px}
.vt li::before{left:-30px;top:13px;margin-left:0}
.vt::before{left:5px}
.vt li.gap span{padding-left:0}
.vt li b{min-width:96px}
.lb{background:#05070a;z-index:200}

/* v10 */
.pop button.fotoW{display:block;width:100%;border:0;border-radius:10px;background:var(--surface-3);padding:0;margin:0 0 8px;overflow:hidden}
.pop .fotoW .foto{width:100%;height:auto;max-height:180px;object-fit:contain;border-radius:0}
.lb.zoom .lb-scroll img{width:170%}
.ht{overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.ht ol{display:flex;list-style:none;margin:0;padding:0;min-width:max-content}
.ht li{position:relative;text-align:center}
.ht li.ev{width:118px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px}
.ht li.ev b{font:600 13.5px var(--sans);color:var(--accent-ink);white-space:nowrap}
.ht li.ev.dest b{color:var(--flag)}
.ht li.ev i{position:relative;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);z-index:1}
.ht li.ev.dest i{background:var(--flag);border-color:var(--flag)}
.ht li.ev span{font-size:13px;line-height:1.3;color:var(--ink)}
.ht li.gap{width:58px;flex:none;display:flex;justify-content:center;align-items:flex-start;padding-top:24px}
.ht li.gap em{font:normal 10.5px var(--sans);color:var(--ink-faint);background:var(--surface-2);padding:0 4px;position:relative;z-index:1;margin-top:-9px;white-space:nowrap}
.ht ol::before{content:"";position:absolute;left:59px;right:59px;top:0;height:0}
.ht li.ev::before,.ht li.gap::before{content:"";position:absolute;top:30px;height:2px;background:var(--rule-2)}
.ht li.ev::before{left:0;right:0}
.ht li.gap::before{left:0;right:0;top:30px}
.ht li.ev:first-child::before{left:50%}
.ht li.ev:last-child::before{right:50%}
.hint{font-size:11px;color:var(--ink-faint);margin:0}
.ht ol{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;gap:0!important;padding:0!important}
.ht li{flex:none}

/* v11 */
.ht{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:auto 26px auto;position:relative;overflow:visible;padding:0;row-gap:4px}
.ht .axis{grid-column:1/-1;grid-row:2;align-self:center;height:2px;background:var(--rule-2);border-radius:2px;margin:0 calc(50% / var(--n))}
.ht .dot{grid-row:2;justify-self:center;align-self:center;width:14px;height:14px;border-radius:50%;background:var(--surface-2);border:3px solid var(--accent);position:relative;z-index:1}
.ht .dot.dest{background:var(--flag);border-color:var(--flag)}
.ht .gp{grid-row:2;justify-self:start;align-self:center;transform:translateX(-50%);font:normal 9.5px var(--sans);color:var(--ink-faint);background:var(--surface-2);padding:0 3px;position:relative;z-index:2;white-space:nowrap}
.ht .lab{display:flex;flex-direction:column;gap:2px;width:calc(200% - 14px);line-height:1.25;font-size:12.5px}
.ht .lab b{font:600 12.5px var(--sans);color:var(--accent-ink)}
.ht .lab.dest b{color:var(--flag)}
.ht .lab span{color:var(--ink)}
.ht .lab{justify-self:center;text-align:center;align-items:center}
.ht .lab.start{justify-self:start;text-align:left;align-items:flex-start;width:calc(150% - 8px)}
.ht .lab.end{justify-self:end;text-align:right;align-items:flex-end;width:calc(150% - 8px)}
.ht .lab[style*="grid-row:1"]{align-self:end}
.ht .lab[style*="grid-row:3"]{align-self:start}
.hint{display:none}
.lb-scroll{overflow:hidden;touch-action:none}
.lb-scroll img{max-width:100%;max-height:100%;transform-origin:center;cursor:grab;user-select:none;-webkit-user-drag:none}
.w.lido-w .gr,.tk.lido-w{color:var(--hl);transition:color .1s}
.ht .axis{background:var(--ink-faint);opacity:.45;justify-self:stretch}

/* v12: linha do tempo em SVG como antes, fontes menores e mais respiro */
.viz .lblb{font:600 10.5px var(--sans)}
.viz .lbl2{font:9px var(--sans);fill:var(--ink-soft)}
.viz .lblb{font:600 11px var(--sans)}.viz .lbl2{font:9.6px var(--sans)}

/* v13: cards sem vazamento; expressões como uma unidade */
.pop{width:240px;max-width:calc(100vw - 16px)}
.pop .gw,.pop .pt,.pop .nota,.pop .exp,.pop .fam{overflow-wrap:anywhere;word-break:break-word}
.pop .gw.it{font-size:1.25rem}
.pop .gw.it.longo{font-size:1.02rem}
.fr{border-radius:6px;cursor:pointer}
.fr .tk:hover{color:inherit}
.fr:hover .tk:not(.lido-w){color:var(--accent-ink)}

/* v14: player compacto; rodapé em cartão */
.player{padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
.pl-title{font-size:11px;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-row{display:flex;align-items:center;gap:6px;margin:0;flex-wrap:nowrap}
.pl-row input{flex:1;min-width:40px;accent-color:var(--accent)}
.pl-row .pl-t,.pl-row .pl-d{font:11px var(--mono);color:var(--ink-faint);min-width:30px;text-align:center}
.pl-row button{padding:4px 9px;font-size:13px;flex:none}
.pl-row .main{min-width:40px}
body.com-player{padding-bottom:78px}
.footcard{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-j);padding:6px}
.footcard > summary{padding:12px 14px;font:600 13px var(--sans);color:var(--ink-soft);cursor:pointer}
.footcard .dz{padding:4px 14px 14px;color:var(--ink-soft);line-height:1.6}
.footcard .foot{border:0;margin:0;padding:0}
.footcard .foot p{margin:0 0 12px}

/* v15: player flutuante, linhas que preenchem a largura */
.player{left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:396px;margin:0 auto;
  border:1px solid var(--rule-2);border-radius:18px;padding:8px 10px 8px;box-shadow:0 12px 32px rgba(0,0,0,.4);background:var(--surface)}
.pl-title{font-size:10.5px;padding:0 4px;margin-bottom:3px}
.pl-row{gap:4px}
.pl-row button{padding:3px 8px;font-size:12.5px;border-radius:999px}
.pl-row .main{min-width:36px}
.pl-row .pl-t,.pl-row .pl-d{min-width:26px;font-size:10.5px}
body.com-player{padding-bottom:96px}
nav.days{flex-wrap:wrap;overflow:visible;gap:4px}
nav.days button{flex:1 1 auto;text-align:center;min-height:36px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{flex:1 1 auto;text-align:center}
.sup{display:flex;flex-wrap:wrap}
.sup button{flex:1 1 auto}

/* v16: player em pílula */
.player{display:flex;align-items:center;gap:8px;left:14px;right:14px;max-width:380px;bottom:calc(30px + env(safe-area-inset-bottom));
  border-radius:999px;padding:7px 10px;border:1px solid var(--rule-2);background:var(--surface);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.pl-side{display:flex;align-items:center;gap:2px;flex:none}
.pl-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pl-title{font:600 10.5px var(--sans);color:var(--ink-faint);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-bar2{display:flex;align-items:center;gap:5px}
.pl-bar2 input{flex:1;min-width:30px;height:16px;accent-color:var(--accent)}
.pl-bar2 .pl-t,.pl-bar2 .pl-d{font:10px var(--mono);color:var(--ink-faint)}
.player button{border:0;background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:50%;display:grid;place-items:center;padding:0}
.player button.ic{width:30px;height:30px}
.player button.ic svg{width:22px;height:22px}
.player button.main{width:40px;height:40px;background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.player button.main svg{width:20px;height:20px}
.player button.sp2{height:26px;min-width:36px;border-radius:999px;font:600 11.5px var(--sans);background:var(--surface-2);color:var(--ink-soft);padding:0 8px}
.player button:active{transform:scale(.94)}
body.com-player{padding-bottom:110px}

/* v17: abas de idioma fixas no topo; dias rolam com a página */
nav.days{position:static;top:auto}
.langtabs{position:sticky;top:8px;z-index:30;box-shadow:0 0 0 8px var(--ground),inset 0 0 0 1px var(--rule)}

/* v18: ▶ em coluna própria; segunda linha da frase alinhada com a primeira */
.il{display:flex;flex-direction:column;flex-wrap:nowrap;gap:0;row-gap:0;padding:6px 14px}
.il .sent{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:12px;align-items:start;padding:12px 0}
.il .sent + .sent{border-top:1px solid var(--rule)}
.il .words{display:flex;flex-wrap:wrap;column-gap:13px;row-gap:14px;align-items:start}
.il .sent > button.sp{margin-top:18px;width:30px;height:30px}
.il .sent > button.sp{align-self:start!important;margin-top:20px}

/* v19: ▶ na borda direita; texto sem recuo */
.il .sent{grid-template-columns:minmax(0,1fr) 30px;column-gap:10px}
.il .sent > button.sp{margin-top:20px;justify-self:end}
.il{padding:6px 16px}
.il{align-items:stretch}.il .sent{width:100%}

/* v20: botões flutuantes do texto grego (mesmo lugar do player; o player assume ao tocar) */
.dock{position:fixed;z-index:65;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));display:flex;gap:4px;
  padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--rule-2);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.dock[hidden]{display:none}
.dock button{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);
  padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.dock button svg{width:18px;height:18px}
.dock button[data-k="ouvir"]{background:var(--accent);color:#fff}
.dock button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.dock button:active{transform:scale(.96)}

/* v21: só ícones */
.dock{gap:6px;padding:5px}
.dock button{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%}
.dock button svg{width:22px;height:22px}

/* v22: ícone + palavra, cores neutras */
.dock{gap:4px;padding:4px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px)}
.dock button{width:auto;height:auto;padding:9px 15px;gap:7px;border-radius:999px;font:500 12.5px var(--sans);color:var(--ink-soft);background:transparent}
.dock button svg{width:17px;height:17px}
.dock button[data-k="ouvir"]{background:var(--surface-2);color:var(--ink)}
.dock button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}

/* v23: botões fixos (sob o texto) idênticos aos flutuantes */
.sup{display:flex;flex-wrap:nowrap;gap:4px;padding:4px;margin:10px auto 2px;width:fit-content;max-width:100%;border-radius:999px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--rule-2);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.sup button,.sup button:first-child{flex:0 0 auto;display:flex;align-items:center;gap:7px;width:auto;min-height:0;height:auto;padding:9px 15px;border:0;border-radius:999px;
  font:500 12.5px var(--sans);color:var(--ink-soft);background:transparent;white-space:nowrap;cursor:pointer}
.sup button svg{width:17px;height:17px}
.sup button[data-k="ouvir"],.sup button:first-child[data-k="ouvir"]{background:var(--surface-2);color:var(--ink)}
.sup button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}

/* o texto de comparação é um parágrafo, não uma linha de resposta */
.ans > span.small{display:block;line-height:1.6}
/* v24 */
.dock button[hidden]{display:none}
.sup.solo{margin:2px auto 0}
.dica{font-size:11.5px;color:var(--ink-faint);text-align:center;margin:-2px 0 6px}

.il.sem-audio .sent{grid-template-columns:minmax(0,1fr)}
.opts{margin-top:12px}.opts .row{display:flex;flex-wrap:wrap;gap:6px}
.opts button{font:inherit;font-size:12px;border:1px solid var(--rule-2);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

</style>
</head>

            "Finally, set expectations. Tell the client which devices you will stress-test and which edge cases you will not chase, such as very old phones. Agree on what \"done\" means before the review, and ask them to send feedback with the device and the browser attached. That way a comment like \"it looks off\" becomes something you can act on."

          "body": [
            "In a design review, \"it breaks on mobile\" is not a useful comment. A good comment names the width, the element and the effect: \"At 360 px the card title reflows to three lines and pushes the button below the fold.\" With that sentence, the designer can reproduce the problem in a minute.",

          "title": "Why 320 pixels still matters",
          "body": [
            "Many designers test their layouts at a laptop width and call the job done. But an accessibility guideline asks for more. WCAG 2.1, success criterion 1.4.10 (Reflow), asks that vertically scrolling content work at a width of 320 CSS pixels without scrolling in two directions. That is roughly a narrow phone — and a 1280-pixel desktop window zoomed to 400 percent.",
            "That makes reflow more than a mobile feature. A person with low vision who zooms in on a laptop gets the same narrow layout. If a table or a fixed-width block forces sideways scrolling, they must move the page back and forth to read each line. The guideline makes an exception for content that truly needs two dimensions, such as maps, diagrams and data tables.",
            "When you write about this in a case study, be specific about it. Say which width you tested, what you changed and what you learned. \"We made the site responsive\" is easy to say. \"We rebuilt the cards so they reflow at 320 pixels\" is a claim a reader can check."

      var sc = document.createElement("article");
      sc.className = "card sum";
      var seg = function (g) {
        return '<span class="seg" data-g="' + g + '">' + [1, 2, 3, 4, 5].map(function (n) {
          return '<button type="button" data-n="' + n + '" aria-pressed="' + (st.notes[g] === n) + '">' + n + '</button>';
        }).join("") + '</span>';
      };
      sc.innerHTML = '<header><span class="b tag">Resumo para o domingo</span></header>' +
        '<p class="muted">Aperte as notas; o resto vem do que você marcou na semana. Depois copie e cole na conversa.</p>' +
        '<div class="rowx"><span>Grego</span>' + seg("gr") + '</div>' +
        '<div class="rowx"><span>Italiano</span>' + seg("it") + '</div>' +
        '<div class="rowx"><span>Inglês</span>' + seg("en") + '</div>' +
        '<textarea readonly aria-label="Resumo"></textarea>' +
        '<button type="button" class="copy">Copiar resumo</button> <span class="small" id="copiado"></span>';
      sun.insertBefore(sc, sun.querySelector(".readbar"));
      var ta = sc.querySelector("textarea");
      sc.addEventListener("click", function (e) {
        var b = e.target.closest(".seg button");
        if (b) {
          var g = b.parentNode.dataset.g; st.notes[g] = Number(b.dataset.n);
          [].forEach.call(b.parentNode.children, function (x) { x.setAttribute("aria-pressed", String(x === b)); });
          save(); pintaResumo(); return;
        }
        if (e.target.classList.contains("copy")) {
          ta.select();
          if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { sc.querySelector("#copiado").textContent = "Copiado."; }, function () {});
          else { try { document.execCommand("copy"); sc.querySelector("#copiado").textContent = "Copiado."; } catch (er) {} }
        }
      });
      pintaResumo = function () {
        var lidos = week.days.filter(function (d) { return st.read[String(d.d)]; }).map(function (d) { return NOMES[d.d]; });
        var misses = Object.keys(st.miss).map(function (k) { return st.miss[k]; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
        var n = function (g) { return st.notes[g] || "—"; };
        var fm = function (x) { var q = x.split("-"); return q[2] + "/" + q[1]; };
        var rg = week.range.split("/");
        ta.value = "Check-in · semana " + week.week + " (" + fm(rg[0]) + " a " + fm(rg[1]) + ")\n" +
          "Dias lidos: " + (lidos.length ? lidos.join(", ") : "nenhum") + " (" + lidos.length + "/7)\n" +
          "Notas: GR " + n("gr") + " · IT " + n("it") + " · EN " + n("en") + "\n" +
          "Frases do sábado, com o apoio escondido: " + (st.frases != null ? st.frases + "/13" : "—") + "\n" +
          "Palavras que não vieram: " + (misses.length ? misses.join(", ") : "nenhuma") + "\n" +
          "Palavras que marquei como esquecidas no card: " + (Object.keys(st.fail).length ? Object.keys(st.fail).join(", ") : "nenhuma");
      };
      pintaResumo();
    }

    // =================================================== organização da interface
    var STEPS = {};
    function reordenaIE(art) {
      var kids = [].slice.call(art.children);
      var porSect = function (re) { return kids.filter(function (n) { var s = n.querySelector && n.querySelector(":scope > .sect"); return s && re.test(s.textContent); })[0]; };
      var dom = porSect(/Domande|Check/), prod = porSect(/Prova a dire|Say it/);
      var conf = kids.filter(function (n) { return n.tagName === "DETAILS" && /Conferir/.test(n.textContent.slice(0, 20)); })[0];
      var gl = art.querySelector("p.glosses"), ctx = porSect(/In context/);
      var tipo = art.querySelector(".b.it") ? "it" : "en", dia = art.closest("section.day").dataset.d;
      if (gl && D[tipo] && D[tipo][dia] && D[tipo][dia].tap) gl.remove();
      if (ctx && D[tipo] && D[tipo][dia] && D[tipo][dia].tap) ctx.remove();
      if (!conf) return;
      // modelo e comparação vão para junto de "Prova a dire"
      var ans = conf.querySelector(".ans"), modelo = [];
      [].slice.call(ans.children).forEach(function (r) {
        var i = r.querySelector && r.querySelector("i");
        if ((i && i.textContent.trim() === "·") || r.classList.contains("small")) { modelo.push(r); r.remove(); }
      });
      if (dom) {
        var lis = dom.querySelectorAll("ol > li");
        [].slice.call(ans.children).forEach(function (r, i) {
          if (lis[i]) { var dv = document.createElement("div"); dv.className = "resp-b"; dv.innerHTML = r.lastElementChild ? r.lastElementChild.innerHTML : r.innerHTML; lis[i].appendChild(dv); }
        });
        var bt2 = document.createElement("button"); bt2.type = "button"; bt2.className = "conf"; bt2.textContent = "Conferir respostas";
        bt2.addEventListener("click", function () { var on = !dom.classList.contains("mostra"); dom.classList.toggle("mostra", on); bt2.textContent = on ? "Esconder respostas" : "Conferir respostas"; });
        dom.appendChild(bt2); conf.remove();
      }
      if (prod && modelo.length) {
        var dd = document.createElement("details"); dd.className = "ver-modelo";
        dd.innerHTML = "<summary>Ver modelo</summary>"; var z = document.createElement("div"); z.className = "dz ans";
        modelo.forEach(function (r) { z.appendChild(r); }); dd.appendChild(z); prod.appendChild(dd);
      }
      var nota = art.querySelector("p.note"), cur = art.querySelector("p.curio");
      if (prod) { if (nota) prod.parentNode.insertBefore(nota, prod); if (cur) prod.parentNode.insertBefore(cur, prod); }
    }
    function elenco() {
      var G = {};
      week.greek.cast.forEach(function (p) { G[p[0]] = p[2] || "fora"; });
      var T = { fam: "A família", casa: "Na casa", fora: "Fora de casa", mito: "Só no mito" };
      var box = document.createElement("div"); box.className = "elenco";
      ["fam", "casa", "fora", "mito"].forEach(function (g) {
        var ps = week.greek.cast.filter(function (p) { return G[p[0]] === g; });
        if (!ps.length) return;
        var sec = document.createElement("div");
        sec.innerHTML = "<h4>" + T[g] + '</h4><div class="grupo">' + ps.map(function (p) {
          var m = /^([^—]+)—\s*(.*)$/.exec(p[1]); var nome = m ? m[1].trim() : "", papel = m ? m[2] : p[1];
          var idade = /uns (\d+) anos/.exec(papel);
          papel = papel.replace(/,?\s*uns \d+ anos( em \d+)?/, "");
          var real = /real/.test(papel);
          return '<div class="pers ' + g + '"><div class="av">' + esc(p[0].charAt(0)) + '</div><div><div class="nm">' + esc(p[0]) + '</div><div class="pt2">' + esc(nome) + " · " + rich(papel) + '</div>' +
            (idade ? '<span class="tg">~' + idade[1] + ' anos</span>' : "") + (real ? '<span class="tg">pessoa real</span>' : "") + '</div></div>';
        }).join("") + "</div>";
        box.appendChild(sec);
      });
      return box;
    }
    function fonteSep(el) {
      [].forEach.call(el.querySelectorAll("p.curio"), function (p) {
        var m = /\s*\(((?:[^()]|<i>[^<]*<\/i>)*)\)\s*$/.exec(p.innerHTML);
        if (m && m[1].length > 6) p.innerHTML = p.innerHTML.slice(0, m.index) + '<span class="fonte">' + m[1] + '</span>';
      });
    }
    function reorganiza() {
      marcaDias();
      // cabeçalho enxuto
      var ph = document.querySelector(".ph"), stats = document.querySelector("dl.stats");
      if (ph && stats) {
        var dd = document.createElement("details"); dd.className = "sobre";
        dd.innerHTML = '<summary>Sobre esta semana</summary>';
        var inner = document.createElement("div"); inner.className = "dz";
        var sub = ph.querySelector(".sub"); if (sub) inner.appendChild(sub);
        inner.appendChild(stats); inner.appendChild(opcoes()); dd.appendChild(inner); ph.appendChild(dd);
      }
      [].forEach.call(document.querySelectorAll("article.card"), function (art) {
        var head = art.querySelector("header");
        if (art.querySelector(".b.gr")) {
          var painel = [];
          var add = function (rot, nodes) { if (nodes.length) painel.push({ rot: rot, nodes: nodes }); };
          var pick = function (sel) { return [].slice.call(art.querySelectorAll(sel)); };
          add("Forma", pick("p.form"));
          add("Som", pick("p.sound"));
          add("Curiosidade", pick("p.curio"));
          var vizAll = pick("details.viz").map(function (d) {
            var bx = document.createElement("div"); bx.className = "vz viz";
            var tt = d.querySelector("summary").textContent;
            bx.innerHTML = '<p class="sect">' + esc(tt) + '</p>' + d.querySelector(".dz").innerHTML;
            d.remove(); bx._m = d.classList.contains("k-map"); return bx;
          });
          add("Lugar", vizAll.filter(function (b) { return b._m; }));
          add("Época", vizAll.filter(function (b) { return !b._m; }));
          add("Quem é quem", pick("details").filter(function (d) { return /Quem é quem/.test(d.querySelector("summary").textContent); }).map(function (d) {
            var bx = elenco(); d.remove(); return bx;
          }));
          if (painel.length) {
            var tabs = document.createElement("div"); tabs.className = "tabs2";
            var row = document.createElement("div"); row.className = "chips";
            var area = document.createElement("div"); area.className = "tpanel"; area.hidden = true;
            painel.forEach(function (pn) { pn.nodes.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); }); });
            painel.forEach(function (pn) {
              var c = document.createElement("button"); c.type = "button"; c.textContent = pn.rot; c.setAttribute("aria-pressed", "false");
              c.addEventListener("click", function () {
                var on = c.getAttribute("aria-pressed") !== "true";
                [].forEach.call(row.children, function (x) { x.setAttribute("aria-pressed", "false"); });
                if (!on) { area.hidden = true; return; }
                c.setAttribute("aria-pressed", "true"); area.hidden = false; area.innerHTML = "";
                pn.nodes.forEach(function (n) { area.appendChild(n); });
                fonteSep(area);
              });
              row.appendChild(c);
            });
            tabs.appendChild(row); tabs.appendChild(area);
            var alf = [].slice.call(art.querySelectorAll("details")).filter(function (d) { return /Alfabeto/.test(d.querySelector("summary").textContent); })[0];
            if (alf) alf.parentNode.insertBefore(tabs, alf); else art.appendChild(tabs);
          }
        } else if (head && art.querySelector(".b.it, .b.en")) {
          reordenaIE(art);
          var corpo = document.createElement("div"); corpo.className = "cbody"; corpo.hidden = true;
          [].slice.call(art.children).forEach(function (n) { if (n !== head) corpo.appendChild(n); });
          var prev = corpo.querySelector("p.setting");
          var pv = document.createElement("p"); pv.className = "preview"; pv.textContent = prev ? prev.textContent : "";
          art.appendChild(pv); art.appendChild(corpo);
          var ch = document.createElement("span"); ch.className = "chev"; ch.textContent = "▸"; head.insertBefore(ch, head.firstChild);
          head.classList.add("acc");
          art._abre = function (abre) { corpo.hidden = !abre; pv.hidden = abre; ch.textContent = abre ? "▾" : "▸"; };
          art._abre(true); ch.remove(); head.classList.remove("acc"); pv.remove();
        }
      });
    }
    reorganiza();
    var foot = document.querySelector(".foot");
    if (foot) {
      var fd = document.createElement("details"); fd.className = "footcard";
      fd.innerHTML = "<summary>Notas desta semana</summary>"; var fz = document.createElement("div"); fz.className = "dz";
      fz.appendChild(foot.cloneNode(true)); fd.appendChild(fz); foot.replaceWith(fd);
    }
    // abas por idioma dentro de cada dia
    [].forEach.call(document.querySelectorAll("section.day"), function (sec) {
      var arts = [].slice.call(sec.querySelectorAll(":scope > article.card"));
      if (arts.length < 2) return;
      var nome = function (a) {
        if (a.querySelector(".b.gr")) return "Grego";
        if (a.querySelector(".b.it")) return "Italiano";
        if (a.querySelector(".b.en")) return "Inglês";
        return a.classList.contains("sum") ? "Resumo" : "Teste";
      };
      var tabs = document.createElement("div"); tabs.className = "langtabs"; tabs.setAttribute("role", "tablist");
      var sel = function (i, sobe) {
        if (sobe) window.scrollTo({ top: 0, behavior: "smooth" });
        arts.forEach(function (a, k) { a.hidden = k !== i; });
        [].forEach.call(tabs.children, function (b, k) { b.setAttribute("aria-selected", String(k === i)); });
        fechaPop();
      };
      arts.forEach(function (a, i) {
        var b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "tab");
        var mn = a.querySelector("header .min");
        b.innerHTML = '<span class="ld ' + (a.querySelector(".b.gr") ? "gr" : a.querySelector(".b.it") ? "it" : a.querySelector(".b.en") ? "en" : "tag") + '"></span>' + nome(a) + (mn ? '<small>' + esc(mn.textContent) + '</small>' : "");
        b.addEventListener("click", function () { sel(i, true); });
        tabs.appendChild(b);
      });
      sec.insertBefore(tabs, arts[0]); sel(0);
    });
    // Fonte: a última parte entre parênteses de Curiosidade/Curiosità vira linha própria
    [].forEach.call(document.querySelectorAll(".curio, .tpanel"), function (el) { fonteSep(el); });

    var navDays = document.querySelector("nav.days");
    navDays.addEventListener("click", function () { setTimeout(function () { fechaPop(); dockCheck(); }, 0); });

    // =================================================== botões flutuantes do texto grego
    var dock = document.createElement("div");
    dock.className = "dock"; dock.hidden = true;
    dock.innerHTML = '<button type="button" data-k="ouvir" aria-label="Ouvir o texto do dia">' + IC.play + '<span>Ouvir o texto</span></button>' +
      '<button type="button" data-k="apoio" aria-label="Esconder ou mostrar o apoio de leitura"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Apoio</span></button>';
    document.body.appendChild(dock);
    var secAtiva = null;
    function visivel(el) { if (!el) return false; var r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < window.innerHeight; }
    function dockCheck() {
      var sec = document.querySelector("section.day:not([hidden])"), art = sec && sec.querySelector("article:not([hidden])");
      var il = art && art.querySelector(".il, p.ita, div.eng"), sup = art && art.querySelector(".sup");
      var mostra = false;
      if (il && sup && pl.hidden) {
        var r = il.getBoundingClientRect();
        mostra = r.bottom > 90 && r.top < window.innerHeight - 90 && !visivel(sup);
      }
      secAtiva = mostra ? sup : null; dock.hidden = !mostra;
      if (mostra) {
        var temApoio = !!art.querySelector(".il"), ap = dock.querySelector('[data-k="apoio"]'), b2 = sup.querySelector('[data-k="apoio"]');
        ap.hidden = !temApoio;
        dock.querySelector('[data-k="ouvir"]').hidden = !sup.querySelector('[data-k="ouvir"]');
        if (b2) { ap.setAttribute("aria-pressed", String(b2.getAttribute("aria-pressed") === "true")); ap.title = b2.title; }
      }
    }
    var tick = 0;
    function agenda() { if (!tick) tick = requestAnimationFrame(function () { tick = 0; dockCheck(); }); }
    window.addEventListener("scroll", agenda, { passive: true }); window.addEventListener("resize", agenda);
    A.addEventListener("play", agenda); A.addEventListener("pause", agenda);
    pl.addEventListener("click", function () { setTimeout(dockCheck, 0); });
    dock.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b || !secAtiva) return;
      var alvo = secAtiva.querySelector('[data-k="' + b.dataset.k + '"]'); if (alvo) alvo.click();
      setTimeout(dockCheck, 0);
    });
    document.addEventListener("click", function (e) { if (e.target.closest(".langtabs")) setTimeout(dockCheck, 400); });
    dockCheck();
  }

  try {
    var week = JSON.parse(document.getElementById("week").textContent);
    adaptaSemana(week);
    render(week);
    wire();
    wireExtras(week);
  } catch (e) {
    document.getElementById("app").innerHTML =
      '<div class="err">O pacote da semana não pôde ser lido.\n' + esc(e.message) +
      '\n\nA fonte é claude/state/WEEK_PACKET.md no projeto. Esta página é só a renderização dela.</div>';
  }
})();
</script>
